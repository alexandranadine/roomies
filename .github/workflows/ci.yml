name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality, tests, migrations, browser
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: roomies
          POSTGRES_PASSWORD: roomies_ci_only
          POSTGRES_DB: roomies_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U roomies -d roomies_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      # Isolated CI database — never production Neon. No repository secrets.
      DATABASE_URL: postgresql://roomies:roomies_ci_only@127.0.0.1:5432/roomies_ci
      TEST_DATABASE_URL: postgresql://roomies:roomies_ci_only@127.0.0.1:5432/roomies_ci
      # Frontend production build must not fall back to localhost.
      VITE_API_ORIGIN: https://api.example.test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies (lockfile)
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Architecture boundaries
        run: npm run check:boundaries

      - name: CI secrets policy
        run: npm run check:ci-secrets

      - name: Typecheck
        run: npm run typecheck

      - name: Backend tests
        run: npm run test --workspace=@roomies/backend

      - name: Frontend unit/component tests
        run: npm run test --workspace=@roomies/frontend

      - name: Frontend production build
        run: npm run build --workspace=@roomies/frontend

      - name: Migration artifact integrity + fresh DB apply/verify
        run: npm run db:test:migrate

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Browser foundation + Axe
        run: npm run test:browser --workspace=@roomies/frontend
